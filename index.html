<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FF2D8C">
<meta name="description" content="Un giorno con te, momento per momento — una piccola sorpresa pensata apposta per te.">
<title>Una giornata ideale con te 💕</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  /* ============ VARIABILI & RESET ============ */
  :root{
    --pink-shock:#FF2D8C;
    --pink-mid:#FF7FB8;
    --pink-soft:#FFC7E1;
    --milk:#FFF8F4;
    --milk-alt:#FFFDFB;
    --red-cta:#E8304A;
    --red-cta-dark:#C91F38;
    --ink:#3D2B39;
    --ink-soft:#8B6B7C;
    --shadow-pink:rgba(255,45,140,0.22);
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; overscroll-behavior:none; }

  body{
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }

  h1,h2,h3,h4{ font-family:var(--font-display); }

  button{ font-family:inherit; border:none; background:none; cursor:pointer; }

  button:focus-visible{
    outline:3px solid var(--pink-shock);
    outline-offset:3px;
    border-radius:4px;
  }

  /* ============ GESTIONE SCHERMATE ============ */
  .screen{
    position:fixed;
    inset:0;
    height:100dvh;
    opacity:0;
    visibility:hidden;
    transform:translateY(16px);
    transition:opacity .5s ease, transform .5s ease, visibility .5s;
    pointer-events:none;
  }
  .screen.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    pointer-events:auto;
  }

  /* ============ SCHERMATA HOME ============ */
  #home-screen{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 7vw;
    background:linear-gradient(160deg, var(--pink-shock) 0%, var(--pink-mid) 45%, var(--pink-soft) 75%, var(--milk) 100%);
    overflow:hidden;
  }

  .home-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:1.1rem;
    max-width:420px;
  }

  @keyframes gentleBeat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  .home-icon{
    font-size:clamp(2.1rem, 9vw, 2.8rem);
    animation:gentleBeat 1.8s ease-in-out infinite;
  }

  #home-screen h1{
    font-style:italic;
    font-weight:600;
    font-size:clamp(2rem, 8.5vw, 2.75rem);
    color:#ffffff;
    text-shadow:0 6px 24px rgba(150,0,60,.35);
    letter-spacing:.2px;
  }

  #home-screen h2{
    font-family:var(--font-body);
    font-weight:500;
    font-size:clamp(.95rem, 4vw, 1.1rem);
    color:rgba(255,255,255,.95);
    max-width:320px;
    line-height:1.6;
  }

  .btn-start{
    margin-top:.6rem;
    padding:1.05rem 3.2rem;
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:.3px;
    color:#ffffff;
    background:linear-gradient(135deg, var(--red-cta), var(--red-cta-dark));
    border-radius:50px;
    box-shadow:0 12px 30px rgba(201,31,56,.45);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn-start:active{ transform:scale(.94); }
  @media (hover:hover){
    .btn-start:hover{
      transform:translateY(-3px) scale(1.02);
      box-shadow:0 16px 36px rgba(201,31,56,.55);
    }
  }

  /* ============ SCHERMATA CARD ============ */
  #cards-screen{
    background:linear-gradient(180deg, var(--pink-soft) 0%, var(--milk) 38%);
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-padding-top:72px;
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
  }

  .cards-topbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1rem 1.25rem;
    background:linear-gradient(180deg, rgba(255,199,225,.92), rgba(255,199,225,.15));
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }

  .back-btn{
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 10px;
    border-radius:50%;
    background:rgba(255,255,255,.75);
    font-size:1.2rem;
    color:var(--pink-shock);
    box-shadow:0 4px 12px rgba(255,45,140,.2);
    transition:transform .2s ease;
  }
  .back-btn:active{ transform:scale(.9); }

  .topbar-spacer{ width:40px; height:40px; display:block; }

  .progress-dots{ display:flex; gap:6px; }
  .progress-dots .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:rgba(255,45,140,.3);
    transition:all .35s ease;
  }
  .progress-dots .dot.active{
    width:22px;
    border-radius:5px;
    background:var(--pink-shock);
  }

  .cards-container{
    padding:1.25rem 1.25rem 3rem;
    display:flex;
    flex-direction:column;
    gap:1.6rem;
  }

  .card{
    scroll-snap-align:center;
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:28px;
    padding: 2rem 1rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:.3rem;
    background:linear-gradient(135deg, #ffffff, var(--milk-alt));
    box-shadow:0 14px 34px var(--shadow-pink), 0 2px 8px rgba(0,0,0,.04);
    border:1px solid rgba(255,255,255,.9);
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(28px) scale(.97);
    transition:opacity .7s ease, transform .7s ease;
  }
  .card.in-view{ opacity:1; transform:translateY(0) scale(1); }

  .card::after{
    content:'';
    position:absolute;
    top:-40px; right:-40px;
    width:130px; height:130px;
    border-radius:50%;
    opacity:.7;
  }
  /* Piccolo segno distintivo: il colore dell'alone segue l'arco della giornata */
  .card:nth-child(1)::after{ background:radial-gradient(circle, #FFDCEB, transparent 72%); }
  .card:nth-child(2)::after{ background:radial-gradient(circle, #FFDCEB, transparent 72%); }
  .card:nth-child(3)::after{ background:radial-gradient(circle, #FFC7E1, transparent 72%); }
  .card:nth-child(4)::after{ background:radial-gradient(circle, #FFC7E1, transparent 72%); }
  .card:nth-child(5)::after{ background:radial-gradient(circle, #FFA8CE, transparent 72%); }
  .card:nth-child(6)::after{ background:radial-gradient(circle, #FFA8CE, transparent 72%); }
  .card:nth-child(7)::after{ background:radial-gradient(circle, #E3A8D6, transparent 72%); }
  .card:nth-child(8)::after{ background:radial-gradient(circle, #E3A8D6, transparent 72%); }

  .card-icon{
    font-size:clamp(1.4rem, 5.5vw, 1.8rem);
    position:relative; z-index:1;
  }
  .card h3{
    position:relative; z-index:1;
    padding-bottom: 5px;
    font-weight:600;
    font-size:clamp(1.15rem, 5vw, 1.4rem);
    color:var(--ink);
  }
  .card h4{
    position:relative; z-index:1;
    font-family:var(--font-body);
    font-weight:700;
    font-size:.7rem;
    padding-bottom: 10px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--pink-shock);
    opacity:.8;
  }
  .card p{
    position:relative; z-index:1;
    font-family:var(--font-body);
    font-weight:500;
    font-size:clamp(.82rem, 3.2vw, .95rem);
    line-height:1.5;
    color:var(--ink-soft);
  }

  .closing{
    scroll-snap-align:center;
    text-align:center;
    padding:2.5rem 1.5rem 1rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.6rem;
    opacity:0;
    transform:translateY(28px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .closing.in-view{ opacity:1; transform:translateY(0); }
  .closing-icon{ font-size:2.1rem; }
  .closing h3{ font-weight:600; font-size:1.3rem; color:var(--pink-shock); }
  .closing p{ font-family:var(--font-body); font-size:.9rem; color:var(--ink-soft); max-width:280px;line-height: 1.5; }

  .btn-restart{
    margin-top:.6rem;
    padding:.85rem 2.2rem;
    font-family:var(--font-body);
    font-weight:700;
    font-size:.95rem;
    color:var(--pink-shock);
    background:#ffffff;
    border:2px solid var(--pink-soft);
    border-radius:50px;
    transition:transform .25s ease, background .25s ease;
  }
  .btn-restart:active{ transform:scale(.95); }
  @media (hover:hover){
    .btn-restart:hover{ background:var(--pink-soft); }
  }

.corner-note{
  position: fixed;
  top: auto;
  left: 50%;
  right: auto;
  bottom: calc(.3rem + env(safe-area-inset-bottom));
  z-index: 20;
  max-width: 60vw;
  margin: 0;
  padding: .4rem .9rem;
  font-family: var(--font-body);
  font-size: .75rem;
  text-align: center;
  color: var(--ink-soft);
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border-radius: 50px;
  box-shadow: 0 4px 14px rgba(255,45,140,.15);
  opacity: 0;
  transform: translateX(-50%) translateY(8px);
  pointer-events: none;
  transition: opacity .5s ease, transform .5s ease;
}
.corner-note.visible{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

  /* ============ ACCESSIBILITÀ ============ */
  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

  <!-- SCHERMATA HOME -->
  <section id="home-screen" class="screen active">
    <div class="home-content">
      <div class="home-icon" aria-hidden="true">💌</div>
      <h1>Una giornata ideale con Meli </h1>
      <h2>La ragazza più affettuosa, bella, sensuale, golosona e premurosa che io conosca.</h2>
      <button id="start-btn" class="btn-start" type="button">Iniziamo</button>
    </div>
  </section>

  <!-- SCHERMATA CARD -->
  <section id="cards-screen" class="screen">
    <div class="cards-topbar">
      <button id="back-btn" class="back-btn" type="button" aria-label="Torna alla home">←</button>
      <div class="progress-dots" id="progress-dots"></div>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </div>
    <div class="cards-container" id="cards-container"></div>
  </section>

<p class="corner-note">Il tuo Massi ❤️</p>

<script>
  // Contenuto delle card: modifica liberamente questo array per personalizzare i messaggi
  const cardsData = [
    { icon:"🌅", title:"Il buongiorno",            tag:"Mattina", text:"La giornata inizia sempre (o quasi) con il tuo messaggio del buongiorno, leggerlo mi dà la carica piu del caffè, ma darti il buongiorno accanto a te nel letto non ha prezzo." },
    { icon:"🥐", title:"Colazione insieme",        tag: "Mattina",   text:"Siamo dei golosoni che si riempiono la pancia facilmente, ma una giornata ideale insieme non può non partire con una colazione dolce." },
    { icon:"🏖️", title:"Una bella spiaggia",         tag:"Mattina",  text:"Un po' di sole e un po' di giochi in acqua insieme ma stiamo attenti alle bruciature, il sole scottaaa." },
    { icon:"🍝", title:"La pausa pranzo",        tag:"Pranzo",  text:"Come dicevo prima siamo dei golosoni, quindi a pranzo ci mangiamo un piattone di pasta ai frutti di mare, che bontà." },
    { icon:"❤️", title:"Coccole pomeridiane",         tag:"Pomeriggio",          text:"Fuori fa davvero troppo caldo, ce ne stiamo a letto insieme a coccolarci e ad amarci, e tu a letto sei più bella che mai." },
    { icon:"🍕", title:"La cena che ci piace",          tag:"Sera",         text:"dopo tutte le coccole ci è tornata fame, ci prepariamo per una buona pizza in un locale carino, il nostro cibo preferito. Ps. sei bellissima con le luci della sera attorno." },
    { icon:"🍨", title:'Un dolce dopo cena', tag:"Sera", text:"passeggiata + un bel gelato con? continua tuu."},
    { icon:"🌃", title:'Fine della giornata', tag:"Notte", text:"Il fine serata ideale, andare a letto insieme dopo una lunga giornata felici con ancora amore da darci."  }
  ];

  const homeScreen     = document.getElementById('home-screen');
  const cardsScreen    = document.getElementById('cards-screen');
  const cardsContainer = document.getElementById('cards-container');
  const dotsContainer  = document.getElementById('progress-dots');
  const startBtn       = document.getElementById('start-btn');
  const backBtn        = document.getElementById('back-btn');

  // Genera dinamicamente le card a partire dai dati
  function renderCards(){
    cardsContainer.innerHTML = cardsData.map((c, i) => `
      <article class="card" data-index="${i}">
        <span class="card-icon" aria-hidden="true">${c.icon}</span>
        <h3>${c.title}</h3>
        <h4>${c.tag}</h4>
        <p>${c.text}</p>
      </article>
    `).join('') + `
      <div class="closing" data-index="${cardsData.length}">
        <span class="closing-icon" aria-hidden="true">♾️</span>
        <h3>Non è finita qui</h3>
        <p>Ci saranno giorni meno belli di questo, in cui magari litighiamo o siamo arrabbiati, il segreto è fare pace ed essere una squadra. E' bello averti al mio fianco.</p>
        <button id="restart-btn" class="btn-restart" type="button">Rivivi questa giornata</button>
      </div>
    `;
  }

  // Genera i puntini di avanzamento
  function renderDots(){
    dotsContainer.innerHTML = cardsData.map((_, i) =>
      `<span class="dot${i === 0 ? ' active' : ''}" data-dot="${i}"></span>`
    ).join('');
  }

  function setActiveDot(index){
    dotsContainer.querySelectorAll('.dot').forEach(dot => {
      dot.classList.toggle('active', Number(dot.dataset.dot) === index);
    });
  }

  // Osserva le card mentre entrano nello schermo: gestisce dissolvenza e puntini
  function initObserver(){
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          const idx = Number(entry.target.dataset.index);
          if(idx < cardsData.length) setActiveDot(idx);
        }
      });
    }, { root: cardsScreen, threshold: .55 });

    document.querySelectorAll('.card, .closing').forEach(el => observer.observe(el));
  }

  function goToCards(){
    homeScreen.classList.remove('active');
    cardsScreen.classList.add('active');
  }

  function goToHome(){
    cardsScreen.classList.remove('active');
    homeScreen.classList.add('active');
    setTimeout(() => { cardsScreen.scrollTop = 0; }, 500);
  }

  startBtn.addEventListener('click', goToCards);
  backBtn.addEventListener('click', goToHome);
  cardsContainer.addEventListener('click', (e) => {
    if(e.target && e.target.id === 'restart-btn') goToHome();
  });

  renderCards();
  renderDots();
  initObserver();

  // Assicura che la prima card sia già visibile appena si apre la schermata
  const firstCard = cardsContainer.querySelector('.card');
  if(firstCard) firstCard.classList.add('in-view');

// Mostra la notina solo sulla schermata card, quando si arriva in fondo
const cornerNote = document.querySelector('.corner-note');
const closingEl  = document.querySelector('.closing');

if(cornerNote && closingEl){
  const noteObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const show = entry.isIntersecting && cardsScreen.classList.contains('active');
      cornerNote.classList.toggle('visible', show);
    });
  }, { root: cardsScreen, threshold: .6 });

  noteObserver.observe(closingEl);

  backBtn.addEventListener('click', () => cornerNote.classList.remove('visible'));
  startBtn.addEventListener('click', () => cornerNote.classList.remove('visible'));
  document.getElementById('restart-btn')?.addEventListener('click', () => cornerNote.classList.remove('visible'));
}

</script>
</body>
</html>
